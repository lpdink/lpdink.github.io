name: Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'src/**'
      - 'scripts/**'
      - 'package*.json'
      - 'vite.config.js'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Publish the built site to the repo root so GitHub Pages works even when
      # the source is set to "Deploy from a branch (main / root)".
      - name: Publish build to repo root
        run: |
          cp -f dist/index.html index.html
          rm -rf assets && cp -r dist/assets ./assets
          # 静态图片（src/public/* 会被 vite 原样拷进 dist）也要同步，否则
          # Pages 走 "Deploy from a branch (main / root)" 时图片会 404
          if [ -d dist/images ]; then
            rm -rf images && cp -r dist/images ./images
          fi
          cp -f dist/favicon.svg favicon.svg
          cp -f dist/404.html 404.html
          if [ -n "$(git status --porcelain -- index.html assets images favicon.svg 404.html)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html assets images favicon.svg 404.html
            git commit -m "build: publish site to repo root [skip ci]"
            git push
          else
            echo "no changes to publish"
          fi

      # Also publish the dist artifact for the "GitHub Actions" Pages source.
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4