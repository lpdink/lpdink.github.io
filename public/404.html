<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>正在跳转 · lpdink</title>
    <script>
      // GitHub Pages SPA fallback: preserve the deep-link path, then load index.
      ;(function () {
        var path = location.pathname + location.search + location.hash
        location.replace('/?page=' + encodeURIComponent(path))
      })()
    </script>
  </head>
